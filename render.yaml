# Render Blueprint — نشر التطبيق + PostgreSQL
services:
  - type: web
    name: smart-inventory
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-inventory-db
          property: connectionString

databases:
  - name: smart-inventory-db
    plan: free
    databaseName: inventory
    user: inventory
